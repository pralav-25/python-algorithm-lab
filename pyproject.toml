[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "python-algorithm-lab"
version = "0.2.0"
description = "Readable Python algorithms with executable examples and independent regression tests."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Pralav Singh"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.16.7"]

[tool.setuptools.packages.find]
include = ["algorithm_lab*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
